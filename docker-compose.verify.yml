# Vérif de session : Postgres + service node pour seed/interrogation.
# (oven/bun n'est pas gondisponible dans ce sandbox -> on remplace par node)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dofus
      POSTGRES_PASSWORD: dofus
      POSTGRES_DB: dofus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dofus"]
      interval: 5s
      timeout: 5s
      retries: 10

  tooling:
    image: node:22
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dofus:dofus@postgres:5432/dofus
    volumes:
      - .:/app
    command: sleep infinity
