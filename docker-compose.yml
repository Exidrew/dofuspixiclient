# NOTE: this file is superseded by docker-compose.local.yml, which builds the
# current `apps/gameserver-ts` code (gateway + core) instead of the removed
# `apps/server` layout that `build: .` used to target.
#
# Kept as a DB-only convenience: it starts just PostgreSQL, matching the
# `dofus` role/database that `just db-create` provisions and that
# `DATABASE_URL` must point at.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dofus
      POSTGRES_PASSWORD: dofus
      POSTGRES_DB: dofus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dofus"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
